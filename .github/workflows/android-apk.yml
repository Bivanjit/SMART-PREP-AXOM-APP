name: Build SmartPrep Axom V4.0.0 Release APK
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [release/v3.5.4-fcm-notifications, release/v3.6.0, build/v3.6.0-profile-fixes-preview, feat/final-release-hardening, feat/4.0.0-practice-math-mock, build/4.0.0-mathtext-verify, build/4.0.0-mathtext-final]
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools and SDK
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-sdk/cmdline-tools"
          mv "$RUNNER_TEMP/android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/android-sdk/platform-tools" >> "$GITHUB_PATH"
          yes | "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/android-sdk" --licenses >/dev/null
          "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/android-sdk" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Install JavaScript dependencies
        run: npm install
      - name: Align Expo SDK package versions
        run: npx expo install --fix
      - name: TypeScript validation
        run: npm run typecheck
      - name: Normalize Expo module publication metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');
          const files = execSync("find node_modules -name expo-module.config.json -not -path '*/.cache/*'", { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          for (const file of files) {
            const dir = path.dirname(file);
            const pkg = JSON.parse(fs.readFileSync(path.join(dir, 'package.json'), 'utf8'));
            const config = JSON.parse(fs.readFileSync(file, 'utf8'));
            const projects = [config.android, ...(config.android?.projects || [])].filter(Boolean);
            for (const project of projects) if (project.publication && !project.publication.version) project.publication.version = pkg.version;
            fs.writeFileSync(file, JSON.stringify(config, null, 2));
          }
          NODE
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Inspect Expo Android autolinking metadata
        run: |
          npx expo-modules-autolinking resolve --platform android --json > "$RUNNER_TEMP/autolinking.json"
          node -e 'const x=require(process.env.RUNNER_TEMP+"/autolinking.json"); console.log(JSON.stringify(x.modules.map((m,i)=>({index:i,name:m.name,projects:m.projects})),null,2))'
      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Publish permanent GitHub Release
        if: github.ref == 'refs/heads/release/v3.5.4-fcm-notifications' || github.ref == 'refs/heads/release/v3.6.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSION}"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          NOTES="SmartPrep Axom Android ${VERSION}

          - Updated app experience and fixes
          - Optional and mandatory in-app update support
          - Download the APK from the SmartPrep Axom website: https://smart-axom-prep.vercel.app/app"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#SmartPrep-Axom.apk" --clobber
            gh release edit "$TAG" --title "SmartPrep Axom ${VERSION}" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "$APK#SmartPrep-Axom.apk" --title "SmartPrep Axom ${VERSION}" --notes "$NOTES" --latest --target "$GITHUB_SHA"
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smartprep-axom-v4.0.0-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
